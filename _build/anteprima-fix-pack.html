<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#0e0f12;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#fff}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .glow{position:absolute;right:-120px;top:-120px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(218,33,40,.55),rgba(218,33,40,0) 65%)}
  .loc{position:absolute;right:70px;top:-40px;width:470px;transform:rotate(4deg);box-shadow:0 30px 60px rgba(0,0,0,.7);border-radius:6px}
  .logo{position:absolute;left:60px;top:52px;width:220px}
  .txt{position:absolute;left:60px;top:150px;width:600px}
  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:150px;line-height:.85;text-transform:uppercase;margin-top:6px}
  p{margin-top:16px;font-size:30px;font-weight:600;color:#d6d8dd}
  .flash{position:absolute;left:60px;bottom:50px;background:#da2128;color:#fff;font-size:64px;padding:10px 26px 2px;transform:rotate(-2deg)}
</style></head><body>
<div class="glow"></div>
<img class="loc" src="../fix-pack/locandina.jpg">
<img class="logo" src="../fix-pack/logo-mak-bianco.svg">
<div class="txt">
  <div class="k din">DADI E BULLONI · 2026</div>
  <h1 class="din">Fix Pack</h1>
  <p>176 pezzi · più di 300 applicazioni.<br>Scegli i kit e ordina su WhatsApp.</p>
</div>
<div class="flash din">154,00 €</div>
</body></html>
