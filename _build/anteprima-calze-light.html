<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#14161a}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .neve{position:absolute;right:-140px;top:-80px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#eaf2fb 70%)}
  .esp{position:absolute;right:50px;top:40px;height:560px;mix-blend-mode:multiply}
  .ruota{position:absolute;right:400px;top:300px;height:300px;mix-blend-mode:multiply}
  .logo{position:absolute;left:60px;top:50px;width:240px}
  .txt{position:absolute;left:60px;top:150px;width:520px}
  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:130px;line-height:.85;text-transform:uppercase;margin-top:8px}
  h1 span{color:#da2128}
  p{margin-top:18px;font-size:28px;font-weight:600}
  .flash{position:absolute;left:60px;bottom:44px;background:#da2128;color:#fff;font-size:52px;padding:10px 22px 2px;transform:rotate(-2deg)}
  .flash i{font-style:normal;font-size:26px}
</style></head><body>
<div class="neve"></div>
<img class="esp" src="../calze-light-espositore/foto/espositore.jpg">
<img class="ruota" src="../calze-light-espositore/foto/light-ruota.jpg">
<img class="logo" src="../calze-light-espositore/logo-npk.svg">
<div class="txt">
  <div class="k din">CALZE DA NEVE MULTIGRIP LIGHT</div>
  <h1 class="din">Starter<br><span>kit</span></h1>
  <p>10 paia + espositore da banco.<br>Trova la taglia e ordina su WhatsApp.</p>
</div>
<div class="flash din">€ 188,40 <i>+ IVA</i></div>
</body></html>
