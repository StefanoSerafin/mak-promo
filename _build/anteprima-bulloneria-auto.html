<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#14161a}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .disc{position:absolute;right:-120px;top:-90px;width:700px;height:700px;border-radius:50%;background:#da2128}
  .r{position:absolute;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 30px rgba(0,0,0,.3)}
  .r1{right:90px;top:50px;width:420px;height:420px}.r1 img{height:340px;transform:rotate(-12deg)}
  .r2{right:420px;top:370px;width:200px;height:200px}.r2 img{width:160px}
  .logo{position:absolute;left:60px;top:52px;width:220px}
  .txt{position:absolute;left:60px;top:150px;width:560px}
  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:92px;line-height:.88;text-transform:uppercase;margin-top:8px}
  h1 span{color:#da2128}
  p{margin-top:18px;font-size:27px;font-weight:600}
  .flash{position:absolute;left:60px;bottom:40px;background:#da2128;color:#fff;font-size:38px;padding:12px 22px 6px;transform:rotate(-2deg)}
</style></head><body>
<div class="disc"></div>
<div class="r r1"><img src="bull-bullone.jpg"></div>
<div class="r r2"><img src="bull-anello.jpg"></div>
<img class="logo" src="../bulloneria-auto/logo-mak-nero.svg">
<div class="txt">
  <div class="k din">ORIGINALE O AFTERMARKET</div>
  <h1 class="din">Bulloneria<br>per la tua <span>auto</span></h1>
  <p>Scegli marca, modello e anno:<br>misure, foto e ordine su WhatsApp.</p>
</div>
<div class="flash din">CERCA PER AUTO</div>
</body></html>
