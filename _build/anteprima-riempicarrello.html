<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#14161a}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .disc{position:absolute;right:-120px;top:-90px;width:720px;height:720px;border-radius:50%;background:#da2128}
  .tiles{position:absolute;right:40px;top:50px;display:grid;grid-template-columns:repeat(3,165px);gap:14px}
  .tiles div{width:165px;height:165px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(0,0,0,.25)}
  .tiles img{max-width:145px;max-height:145px}
  .logo{position:absolute;left:60px;top:52px;width:220px}
  .txt{position:absolute;left:60px;top:160px;width:560px}
  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:126px;line-height:.85;text-transform:uppercase;margin-top:8px}
  h1 span{color:#da2128}
  p{margin-top:22px;font-size:28px;font-weight:600}
  .flash{position:absolute;left:60px;bottom:44px;background:#da2128;color:#fff;font-size:40px;padding:12px 22px 6px;transform:rotate(-2deg)}
</style></head><body>
<div class="disc"></div>
<div class="tiles">
  <div><img src="../riempicarrello/foto/7800000EZR.png"></div>
  <div><img src="../riempicarrello/foto/93I0000006.png"></div>
  <div><img src="../riempicarrello/foto/9300000337.png"></div>
  <div><img src="../riempicarrello/foto/93000TR413.png"></div>
  <div><img src="../riempicarrello/foto/9300000336.png"></div>
  <div><img src="../riempicarrello/foto/8050000902.png"></div>
</div>
<img class="logo" src="../riempicarrello/logo-mak-nero.svg">
<div class="txt">
  <div class="k din">12 ARTICOLI PER L'OFFICINA</div>
  <h1 class="din">Riempi il<br><span>carrello</span></h1>
  <p>Scegli le quantità e ordina su WhatsApp.</p>
</div>
<div class="flash din">AGGIUNGILI AL TUO ORDINE MAK</div>
</body></html>
