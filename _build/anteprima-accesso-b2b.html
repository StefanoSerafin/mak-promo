<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#14161a}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .disc{position:absolute;right:-110px;top:-120px;width:700px;height:700px;border-radius:50%;background:#da2128}

  h1 span{color:#da2128}
  p{margin-top:18px;font-size:28px;font-weight:600}
  p code{font-family:Menlo,monospace;background:#ffe066;padding:0 6px;border-radius:6px}
  .flash{position:absolute;left:60px;bottom:44px;background:#da2128;color:#fff;font-size:42px;padding:12px 22px 6px;transform:rotate(-2deg)}

<div class="disc"></div>

</div>

</body></html>
