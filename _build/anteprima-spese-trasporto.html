<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#14161a}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .logo{position:absolute;left:60px;top:50px;width:240px}
  .txt{position:absolute;left:60px;top:140px;width:620px}
  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:132px;line-height:.86;text-transform:uppercase;margin-top:6px}
  h1 span{color:#da2128}
  .sotto{position:absolute;left:60px;bottom:84px;font-size:30px;font-weight:500}
  .sotto b{border-bottom:4px solid #da2128}
  .fasce{position:absolute;right:60px;top:118px;width:420px;display:grid;gap:12px}
  .fasce div{display:flex;justify-content:space-between;align-items:center;background:#f3f4f6;border-radius:16px;padding:18px 22px 12px;border-left:8px solid #14161a}
  .fasce small{font-size:22px;color:#5d626b;font-weight:600;font-family:"Avenir Next",sans-serif}
  .fasce b{font-size:64px;line-height:1}
  .fasce .g{background:#da2128;color:#fff;border-left-color:#14161a}
  .fasce .g small{color:#ffe1e2}
</style></head><body>
<img class="logo" src="../spese-trasporto/logo-mak-nero.svg">
<div class="txt">
  <div class="k din">SPESE DI TRASPORTO · ZONA NORD</div>
  <h1 class="din">Spedizione<br><span>gratis</span></h1>
</div>
<div class="sotto">da <b>550 € + IVA</b>: quanto ti manca?</div>
<div class="fasce din">
  <div><small>fino a 199,99 €</small><b>12 €</b></div>
  <div><small>da 200 a 549,99 €</small><b>10 €</b></div>
  <div class="g"><small>da 550 €</small><b>GRATIS</b></div>
  <div style="background:none;border:0;padding:0 4px;justify-content:flex-end"><small>importi + IVA</small></div>
</div>
</body></html>
