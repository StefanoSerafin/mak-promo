<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  h1 span{color:#da2128}
  p{margin-top:18px;font-size:28px;font-weight:600}
  .flash{position:absolute;left:60px;bottom:40px;background:#da2128;color:#fff;font-size:42px;padding:12px 22px 6px;transform:rotate(-2deg)}

<div class="disc"></div>
<div class="r r1"><img src="../copriruota/foto/740014S242.jpg"></div>

</div>
