<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#14161a}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .logo{position:absolute;left:60px;top:52px;width:220px}
  .txt{position:absolute;left:60px;top:145px;width:600px}
  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:118px;line-height:.86;text-transform:uppercase;margin-top:8px}
  h1 span{color:#da2128}
  p{margin-top:18px;font-size:28px;font-weight:600}
  .box{position:absolute;right:50px;top:175px;width:470px;background:#f3f4f6;border-left:8px solid #da2128;padding:22px 24px}

  .box .r{font-size:44px;color:#14833b;line-height:1;margin-top:4px;padding-top:4px}
  .sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
  .sc div{background:#14833b;color:#fff;text-align:center;font-size:30px;padding:10px 0 4px;border-radius:8px}
  .flash{position:absolute;left:60px;bottom:44px;background:#14161a;color:#fff;font-size:40px;padding:12px 22px 6px;transform:rotate(-2deg)}
</style></head><body>
<img class="logo" src="../canali-etrto/logo-mak-nero.svg">
<div class="txt">
  <div class="k din">VERIFICA ETRTO</div>
  <h1 class="din">Che canale<br><span>ci va?</span></h1>

</div>
<div class="box"><small>ESEMPIO</small><div class="m din">205/55 R16</div><div class="r din">da 5½J a 7½J</div>
<div class="sc din"><div>5½J</div><div>6J</div><div>6½J</div><div>7J</div><div>7½J</div></div></div>

</body></html>
