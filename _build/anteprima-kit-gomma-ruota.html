<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  :root{ --red:#da2128; --ink:#14161a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:var(--ink)}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .disc{position:absolute;right:-90px;top:-25px;width:680px;height:680px;border-radius:50%;background:var(--red)}
  .kit{position:absolute;right:-10px;top:25px;width:580px;filter:drop-shadow(0 20px 22px rgba(0,0,0,.3))}
  .logo{position:absolute;left:60px;top:48px;width:230px}
  .txt{position:absolute;left:60px;top:150px;width:560px}
  .k{font-size:26px;letter-spacing:5px;color:var(--red)}
  h1{font-size:118px;line-height:.86;text-transform:uppercase;margin-top:8px}
  h1 span{color:var(--red)}
  p{margin-top:20px;font-size:30px;font-weight:600}
  .flash{position:absolute;left:60px;bottom:44px;background:var(--red);color:#fff;font-size:40px;padding:12px 22px 6px;transform:rotate(-2deg);letter-spacing:1px}
</style></head><body>
<div class="disc"></div>
<img class="kit" src="../kit-gomma-ruota/kit.webp">
<img class="logo" src="../kit-gomma-ruota/logo-mak.svg">
<div class="txt">
  <div class="k din">STAGIONE INVERNALE · B2B</div>
  <h1 class="din">Kit Gomma<span>&amp;</span><br>Ruota</h1>
  <p>Pronti da montare, configurati da te.</p>
</div>
<div class="flash din">MONTAGGIO GRATUITO FINO AL 31/12</div>
</body></html>
