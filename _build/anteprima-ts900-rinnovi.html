<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#0e0f12;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#fff}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .glow{position:absolute;right:-120px;top:-140px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(218,33,40,.55),rgba(218,33,40,0) 65%)}

  .txt{position:absolute;left:60px;top:60px;width:560px}
  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:132px;line-height:.86;text-transform:uppercase;margin-top:8px}
  h1 span{color:#da2128}
  p{margin-top:18px;font-size:29px;font-weight:600;color:#d6d8dd;line-height:1.25}
  .flash{position:absolute;left:60px;bottom:46px;background:#da2128;color:#fff;font-size:46px;padding:10px 24px 2px;transform:rotate(-2deg)}
</style></head><body>
<div class="glow"></div>
<img class="tool" src="../ts900-rinnovi/ts900.png">
<div class="txt">
  <div class="k din">AUTEL MAXITPMS TS900</div>
  <h1 class="din">Il tuo TS900<br><span>scade?</span></h1>
  <p>Controlla la data in 30 secondi.<br>Rinnova aggiornamento e SGW.</p>
</div>
<div class="flash din">RINNOVI DA 160 € + IVA</div>
</body></html>
