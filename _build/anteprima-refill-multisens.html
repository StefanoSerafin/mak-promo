<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#14161a}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .disc{position:absolute;right:-110px;top:-60px;width:660px;height:660px;border-radius:50%;background:#da2128}
  .ma41{position:absolute;right:250px;top:40px;height:440px;transform:rotate(7deg);filter:drop-shadow(0 20px 20px rgba(0,0,0,.35))}
  .s{position:absolute;width:230px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
  .logo{position:absolute;left:60px;top:50px;width:230px}
  .txt{position:absolute;left:60px;top:140px;width:560px}
  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:118px;line-height:.86;text-transform:uppercase;margin-top:6px}
  h1 span{color:#da2128}
  .prezzi{position:absolute;left:60px;bottom:50px;display:flex;align-items:center;gap:18px}
  .old{font-size:58px;color:#8a8f98;position:relative}
  .old::after{content:"";position:absolute;left:-4px;right:-4px;top:44%;height:5px;background:#da2128;transform:rotate(-8deg)}
  .fr{font-size:46px;color:#da2128}
  .new{background:#da2128;color:#fff;font-size:84px;padding:10px 22px 0;line-height:1}
  .new i{font-style:normal;font-size:30px;margin-left:4px}
  .iva{position:absolute;left:62px;bottom:20px;font-size:20px;color:#5d626b}
</style></head><body>
<div class="disc"></div>
<img class="ma41" src="../refill-multisens/ma41.webp">
<img class="s" src="../refill-multisens/mp6-rubber.png" style="right:20px;top:330px">
<img class="s" src="../refill-multisens/mp6-silver.png" style="right:60px;top:110px;width:200px">
<img class="logo" src="../refill-multisens/logo-mate-nero.svg">
<div class="txt">
  <div class="k din">MULTISENS MP6 · RIORDINO TPMS</div>
  <h1 class="din">Refill<br><span>20</span> pezzi</h1>
</div>
<div class="prezzi din"><span class="old">€ 20,40</span><span class="fr">→</span><span class="new">€ 15,90<i>cad.</i></span></div>
<div class="iva">+ IVA · minimo 20 pezzi, anche misti</div>
</body></html>
