<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden;font-family:"Avenir Next",sans-serif;color:#14161a}
  .din{font-family:"DIN Condensed",sans-serif;font-weight:700}
  .neve{position:absolute;right:-120px;top:-90px;width:740px;height:740px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#eaf2fb 70%)}

  .logo{position:absolute;left:60px;top:50px;width:230px}

  .k{font-size:26px;letter-spacing:5px;color:#da2128}
  h1{font-size:150px;line-height:.82;text-transform:uppercase;margin-top:8px}
  h1 span{color:#da2128}
  p{margin-top:20px;font-size:28px;font-weight:600}
  .linee{position:absolute;left:60px;bottom:40px;display:flex;gap:10px}
  .linee span{font-size:22px;font-weight:700;background:#14161a;color:#fff;padding:8px 14px 6px;border-radius:8px}
</style></head><body>
<div class="neve"></div>
<img class="foto" src="../calze-neve/foto/original-grande.jpg">
<img class="logo" src="../calze-neve/logo-npk.svg">
<div class="txt">
  <div class="k din">OMOLOGATE UNI EN 16662-1</div>
  <h1 class="din">Calze<br><span>da neve</span></h1>
  <p>Metti la misura del pneumatico:<br>taglia e codice di ogni linea.</p>
</div>
<div class="linee"><span>The Original</span><span>Re-Grip</span><span>Light</span><span>EZ Urban</span></div>
</body></html>
