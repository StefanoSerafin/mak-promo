<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Le mie locandine</title>
<meta name="theme-color" content="#da2128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Locandine">
<link rel="apple-touch-icon" href="icona.png">
<!-- Dashboard delle locandine interattive di Stefano. Elenco da campagne.js (generato da _build/dashboard.py),
     numeri dal contatore mak-promo-conta (GET /serie e /riepilogo, chiave di lettura salvata solo su questo telefono).
     Niente conta.js: la dashboard non conta sé stessa. -->
<style>
:root{
  --red:#da2128; --blu:#2a6fdb; --ink:#14161a; --mute:#5d626b; --card:#f3f4f6; --line:#e2e4e8; --bg:#fff; --verde:#25d366; --ok:#14833b;
  --titolo:"DIN Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --testo:"Avenir Next",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--testo);font-size:16px;line-height:1.4}
body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 10px}
.k{font-size:12px;letter-spacing:3px;color:var(--red);font-weight:700;text-transform:uppercase}
h1{font-family:var(--titolo);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase;margin:4px 0 2px}
h1 span{color:var(--red)}
h2{font-family:var(--titolo);font-weight:700;font-size:28px;line-height:1;text-transform:uppercase;margin:26px 0 10px}
h2 small{font-family:var(--testo);font-size:13px;font-weight:600;color:var(--mute);text-transform:none;margin-left:6px}
.sub{color:var(--mute);font-size:14px;margin:0}

/* controlli: radio + label */
.scelte{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px;margin-top:12px}
.scelte::-webkit-scrollbar{display:none}
.scelte input{position:absolute;opacity:0;pointer-events:none}
.scelte label{flex:none;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.scelte input:checked+label{background:var(--ink);border-color:var(--ink);color:#fff}
.scelte.piccole label{font-size:13px;padding:6px 11px}
.scelte .et{flex:none;font-size:12px;color:var(--mute);align-self:center;margin-right:2px;text-transform:uppercase;letter-spacing:1px}

/* chiave */
.chiave{background:var(--card);border-radius:16px;padding:14px;margin-top:14px}
.chiave b{display:block;font-family:var(--titolo);font-size:22px;text-transform:uppercase;line-height:1;padding-top:2px}
.chiave p{margin:6px 0 10px;font-size:14px;color:var(--mute)}
.chiave .riga{display:flex;gap:8px}
.chiave input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:12px}
.chiave button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:0 16px;background:var(--ink);color:#fff}
.errore{color:var(--red);font-weight:600}

/* numeri */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi div{background:var(--card);border-radius:14px;padding:10px 10px 8px}
.kpi small{display:block;font-size:12px;color:var(--mute);font-weight:600;line-height:1.2}
.kpi b{display:block;font-family:var(--titolo);font-size:34px;line-height:1;padding-top:6px}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap}
.kpi em.su{color:var(--ok)} .kpi em.giu{color:var(--red)}
.kpi .wa{box-shadow:inset 0 -3px 0 var(--blu)} .kpi .ap{box-shadow:inset 0 -3px 0 var(--red)}

/* grafico */
.graf{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 10px 6px}
.leg{display:flex;gap:14px;font-size:13px;color:var(--mute);margin:0 0 6px 4px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.graf svg{display:block;width:100%;height:auto;overflow:visible}
.graf svg text{font-family:var(--testo);font-size:11px;fill:var(--mute)}
.punto{min-height:22px;font-size:13px;margin:4px 4px 2px;color:var(--ink)}
.tab{margin-top:6px;font-size:13px}
.tab summary{cursor:pointer;color:var(--mute);font-weight:600;padding:4px}
.tab table{width:100%;border-collapse:collapse;margin-top:4px}
.tab td,.tab th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.tab td:first-child,.tab th:first-child{text-align:left}
.nota{font-size:12px;color:var(--mute);margin:8px 2px 0}

/* catalogo */
.sch{display:grid;grid-template-columns:104px 1fr;gap:10px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px;cursor:pointer}
.sch img{width:104px;height:auto;aspect-ratio:1200/630;object-fit:cover;border-radius:10px;display:block;background:#e6e8eb}
.sch b{display:block;font-size:15px;line-height:1.25}
.sch .dal{font-size:12px;color:var(--mute);margin-top:2px}
.mini{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fff;border-radius:12px;padding:7px 4px 5px;text-align:center}
.mini b{display:block;font-family:var(--titolo);font-size:22px;line-height:1;padding-top:2px}
.mini small{display:block;font-size:10px;color:var(--mute);letter-spacing:.2px}
.mini .ap b{color:var(--red)} .mini .wa b{color:var(--blu)}
.bt{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 58px 76px;gap:6px}
.bt .nu{background:#fff;color:var(--red);border:1px solid var(--red)}
/* tabella locandina per locandina */
.conf{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:10px 8px 4px;overflow-x:auto}
.conf h3{margin:2px 2px 6px;font-family:var(--titolo);font-size:22px;text-transform:uppercase;line-height:1;padding-top:2px}
.conf table{width:100%;border-collapse:collapse;font-size:13px}
.conf th{font-size:11px;color:var(--mute);font-weight:600;text-align:right;padding:4px 3px;cursor:pointer;white-space:nowrap;user-select:none}
.conf th:first-child{text-align:left}
.conf th.on{color:var(--red)}
.conf td{padding:7px 3px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.conf td:first-child{text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conf tr[data-c]{cursor:pointer}
.conf tr.zero td{color:#9aa0a8}
.bt button,.bt a{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:12px;padding:11px 6px;text-align:center;text-decoration:none;cursor:pointer}
.bt .cp{background:var(--ink);color:#fff}
.bt .cp.ok{background:var(--ok)}
.bt .wa{background:var(--verde);color:#062e16}
.bt .ap{background:#fff;color:var(--ink);border:1px solid var(--line)}
details.arch{margin-top:20px}
details.arch summary{cursor:pointer;font-family:var(--titolo);font-size:24px;text-transform:uppercase;color:var(--mute);padding:4px 0}

/* dettaglio */
.indietro{display:inline-block;font:inherit;font-weight:700;color:var(--red);background:none;border:0;padding:6px 0;cursor:pointer}
.det-testa img{width:100%;height:auto;border-radius:14px;display:block;margin:6px 0 10px}
.det-testa b{display:block;font-family:var(--titolo);font-size:30px;line-height:1;text-transform:uppercase;padding-top:2px}
.det-testa p{margin:4px 0 0;font-size:14px;color:var(--mute)}
.elenco{list-style:none;margin:0;padding:0}
.elenco li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.elenco li span{white-space:pre-line}
.elenco li b{font-family:var(--titolo);font-size:20px;flex:none}
.vuoto{color:var(--mute);font-size:14px;padding:6px 0}

.piede{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.piede button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer}
.piede .via{border:0;background:none;color:var(--mute);text-decoration:underline;padding:7px 0;font-weight:500}
[hidden]{display:none!important}
</style>
<script src="campagne.js?v=9b0927b3"></script>
</head>
<body>
<div class="wrap">
  <div class="k">MAK · Stefano Serafin</div>
  <h1>Le mie <span>locandine</span></h1>
  <p class="sub" id="intro"></p>

  <div class="scelte" id="periodi"></div>
  <div class="scelte piccole" id="gruppi"></div>

  <div class="chiave" id="boxChiave" hidden>
    <b>Chiave di lettura</b>
    <p id="chiaveTesto">Per vedere i numeri incolla la chiave del contatore. Resta salvata solo su questo telefono.</p>
    <div class="riga"><input type="password" id="chiave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Incolla la chiave" aria-label="Chiave di lettura"><button type="button" id="salva">Salva</button></div>
  </div>

  <!-- vista elenco -->
  <div id="vistaElenco">
    <div id="statistiche" hidden>
      <div class="kpi" id="kpi"></div>
      <div class="graf" id="graf"></div>
      <div class="conf" id="conf"></div>
      <p class="nota" id="notaTel"></p>
    </div>
    <div id="catalogo"></div>
  </div>

  <!-- vista dettaglio -->
  <div id="vistaDettaglio" hidden>
    <button type="button" class="indietro" id="indietro">← Tutte le locandine</button>
    <div id="dettaglio"></div>
  </div>

  <div class="piede">
    <span id="stato">Elenco aggiornato al <span id="generato"></span></span>
    <button type="button" id="aggiorna" hidden>Aggiorna i numeri</button>
    <button type="button" class="via" id="dimentica" hidden>Dimentica la chiave su questo telefono</button>
  </div>
</div>

<script>
const ENDPOINT = "https://mak-promo-conta.serafin-stefano72.workers.dev";
const FRASE_WA = "Ti mando questo modulo interattivo che spiega tutto:";
const PERIODI = [["oggi", "Oggi"], ["7g", "7 giorni"], ["sett", "Questa settimana"], ["mese", "Questo mese"], ["mesep", "Mese scorso"], ["sempre", "Da sempre"]];
const GRUPPI = [["giorno", "Giorno"], ["sett", "Settimana"], ["mese", "Mese"]];
const TIPI = [["apertura", "Aperture"], ["whatsapp", "WhatsApp"], ["chiama", "Chiamate"], ["b2b", "Portale B2B"], ["mail", "Email"], ["ricerca", "Ricerche"], ["vocale", "Vocale avviato"], ["vocale_tutto", "Vocale ascoltato fino in fondo"]];
const MESI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];

document.addEventListener("DOMContentLoaded", () => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const NOTE = new Set(CAMPAGNE.map(c => c.c));
  const PER_C = Object.fromEntries(CAMPAGNE.map(c => [c.c, c]));

  /* ---------- date in ora italiana, come le salva il Worker ---------- */
  const oggi = () => new Date().toLocaleDateString("sv-SE", {timeZone: "Europe/Rome"});
  const d2 = s => new Date(s + "T00:00:00Z");
  const s2 = d => d.toISOString().slice(0, 10);
  const piu = (s, n) => { const d = d2(s); d.setUTCDate(d.getUTCDate() + n); return s2(d); };
  const diff = (a, b) => Math.round((d2(b) - d2(a)) / 864e5);
  const lunedi = s => piu(s, -((d2(s).getUTCDay() + 6) % 7));
  const gg = s => s.slice(8, 10) + "/" + s.slice(5, 7);
  const ggm = s => +s.slice(8, 10) + " " + MESI[+s.slice(5, 7) - 1];

  /* ---------- memoria del telefono (sempre in try/catch) ---------- */
  const mem = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
    del: k => { try { localStorage.removeItem(k); } catch (e) {} },
  };

  let chiave = mem.get("dash-chiave") || "";
  let periodo = mem.get("dash-periodo") || "7g";
  let gruppo = mem.get("dash-gruppo") || "giorno";
  let SERIE = null, aperta = null, oraAgg = null;
  let ordConf = mem.get("dash-ord") || "apertura";

  $("generato").textContent = ggm(GENERATO) + " " + GENERATO.slice(0, 4);
  $("intro").textContent = CAMPAGNE.length + " locandine interattive, " + ARGOMENTI.length + " argomenti. Copia il link o mandalo su WhatsApp.";

  /* ---------- controlli periodo e raggruppamento ---------- */
  function radio(box, nome, voci, scelto, cb, etichetta) {
    $(box).innerHTML = (etichetta ? '<span class="et">' + etichetta + "</span>" : "") + voci.map(([v, t]) =>
      '<input type="radio" name="' + nome + '" id="' + nome + v + '" value="' + v + '"' + (v === scelto ? " checked" : "") + '><label for="' + nome + v + '">' + t + "</label>").join("");
    $(box).querySelectorAll("input").forEach(r => r.addEventListener("change", () => cb(r.value)));
  }
  radio("periodi", "per", PERIODI, periodo, v => {
    periodo = v; mem.set("dash-periodo", v);
    const auto = {oggi: "giorno", "7g": "giorno", sett: "giorno", mese: "giorno", mesep: "giorno", sempre: "sett"}[v];
    if (auto !== gruppo) { gruppo = auto; mem.set("dash-gruppo", auto); document.getElementById("grp" + auto).checked = true; }
    disegna();
  });
  radio("gruppi", "grp", GRUPPI, gruppo, v => { gruppo = v; mem.set("dash-gruppo", v); disegna(); }, "Grafico per");

  function intervallo() {
    const t = oggi();
    const inizio = SERIE && SERIE.partenza ? SERIE.partenza : t;
    switch (periodo) {
      case "oggi": return [t, t];
      case "7g": return [piu(t, -6), t];
      case "sett": return [lunedi(t), t];
      case "mese": return [t.slice(0, 8) + "01", t];
      case "mesep": { const fine = piu(t.slice(0, 8) + "01", -1); return [fine.slice(0, 8) + "01", fine]; }
      default: return [inizio < t ? inizio : t, t];
    }
  }
  const precedente = ([dal, al]) => { const n = diff(dal, al) + 1; return [piu(dal, -n), piu(dal, -1)]; };

  /* ---------- somme ---------- */
  function somma(dal, al, solo) {
    const t = {apertura: 0, whatsapp: 0, chiama: 0, b2b: 0, mail: 0, ricerca: 0, vocale: 0, vocale_tutto: 0, tel: 0};
    const per = {};
    if (!SERIE) return {t, per};
    SERIE.righe.forEach(([g, c, tipo, n]) => {
      if (g < dal || g > al || !NOTE.has(c) || (solo && c !== solo)) return;
      t[tipo] = (t[tipo] || 0) + n;
      (per[c] = per[c] || {apertura: 0, whatsapp: 0, ricerca: 0, tel: 0})[tipo] = (per[c][tipo] || 0) + n;
    });
    SERIE.visitatori.forEach(([g, c, v]) => {
      if (g < dal || g > al || !NOTE.has(c) || (solo && c !== solo)) return;
      (per[c] = per[c] || {apertura: 0, whatsapp: 0, ricerca: 0, tel: 0}).tel += v;
      if (solo) t.tel += v;
    });
    if (!solo) SERIE.giorni.forEach(([g, v]) => { if (g >= dal && g <= al) t.tel += v; });
    return {t, per};
  }

  function chiaveGruppo(g) { return gruppo === "giorno" ? g : gruppo === "sett" ? lunedi(g) : g.slice(0, 7); }
  function etichetta(k) {
    if (gruppo === "giorno") return gg(k);
    if (gruppo === "sett") return gg(k);
    return MESI[+k.slice(5, 7) - 1] + " " + k.slice(2, 4);
  }
  function serieGrafico(dal, al, solo) {
    const b = new Map();
    for (let g = dal; g <= al; g = piu(g, 1)) { const k = chiaveGruppo(g); if (!b.has(k)) b.set(k, {k, ap: 0, wa: 0, ri: 0}); }
    SERIE.righe.forEach(([g, c, tipo, n]) => {
      if (g < dal || g > al || !NOTE.has(c) || (solo && c !== solo)) return;
      const x = b.get(chiaveGruppo(g));
      if (tipo === "apertura") x.ap += n; else if (tipo === "whatsapp") x.wa += n; else if (tipo === "ricerca") x.ri += n;
    });
    return [...b.values()];
  }

  /* ---------- grafico a barre (SVG, un asse, aperture rosse e WhatsApp blu) ---------- */
  function grafico(box, dati, titoloPer) {
    const W = 520, H = 190, L = 30, R = 6, T = 10, B = 26;
    const max = Math.max(1, ...dati.map(x => x.ap), ...dati.map(x => x.wa));
    const passo = Math.pow(10, Math.floor(Math.log10(max)));
    const tick = [1, 2, 5, 10].map(m => m * passo).find(t => max / t <= 4) || passo * 10;
    const top = Math.ceil(max / tick) * tick;
    const n = dati.length, cw = (W - L - R) / n, bw = Math.max(2, Math.min(28, cw * .62)), wb = Math.max(2, bw * .5);
    const y = v => T + (H - T - B) * (1 - v / top);
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Aperture e WhatsApp per ' + titoloPer + '">';
    for (let v = 0; v <= top; v += tick) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e2e4e8" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + "</text>";
    const ogni = Math.ceil(n / 8);
    dati.forEach((x, i) => {
      const cx = L + cw * i + cw / 2;
      const barra = (v, w, col) => v ? '<path d="M' + (cx - w / 2) + "," + y(0) + "V" + (y(v) + Math.min(4, w / 2)) + "q0,-" + Math.min(4, w / 2) + " " + Math.min(4, w / 2) + ",-" + Math.min(4, w / 2) + "H" + (cx + w / 2 - Math.min(4, w / 2)) + "q" + Math.min(4, w / 2) + ",0 " + Math.min(4, w / 2) + "," + Math.min(4, w / 2) + "V" + y(0) + 'Z" fill="' + col + '"/>' : "";
      s += barra(x.ap, bw, "#da2128");
      if (x.wa) s += '<rect x="' + (cx - wb / 2 - 2) + '" y="' + (y(x.wa) - 2) + '" width="' + (wb + 4) + '" height="' + (y(0) - y(x.wa) + 2) + '" fill="#fff" rx="3"/>' + barra(x.wa, wb, "#2a6fdb");
      if (i % ogni === 0) s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + etichetta(x.k) + "</text>";
      s += '<rect class="hit" data-i="' + i + '" x="' + (L + cw * i) + '" y="' + T + '" width="' + cw + '" height="' + (H - T) + '" fill="transparent"/>';
    });
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#5d626b" stroke-width="1"/></svg>';
    const nomeG = {giorno: "giorno", sett: "settimana dal", mese: "mese"}[gruppo];
    box.innerHTML = '<div class="leg"><span><i style="background:#da2128"></i>Aperture</span><span><i style="background:#2a6fdb"></i>WhatsApp</span></div>' + s +
      '<div class="punto" aria-live="polite">Tocca una barra per vedere i numeri.</div>' +
      '<details class="tab"><summary>Vedi i numeri in tabella</summary><table><tr><th>' + (gruppo === "sett" ? "Settimana dal" : gruppo === "mese" ? "Mese" : "Giorno") + "</th><th>Aperture</th><th>WhatsApp</th><th>Ricerche</th></tr>" +
      dati.map(x => "<tr><td>" + etichetta(x.k) + "</td><td>" + x.ap + "</td><td>" + x.wa + "</td><td>" + x.ri + "</td></tr>").join("") + "</table></details>";
    const punto = box.querySelector(".punto");
    box.querySelectorAll(".hit").forEach(h => {
      const mostra = () => {
        const x = dati[+h.dataset.i];
        box.querySelectorAll(".hit").forEach(o => o.setAttribute("fill", "transparent"));
        h.setAttribute("fill", "rgba(20,22,26,.06)");
        punto.innerHTML = "<b>" + (gruppo === "sett" ? "Settimana dal " : "") + etichetta(x.k) + "</b>: " + x.ap + " aperture · " + x.wa + " WhatsApp · " + x.ri + " ricerche";
      };
      h.addEventListener("click", mostra); h.addEventListener("mouseenter", mostra);
    });
  }

  /* ---------- riquadro numeri ---------- */
  function kpi(box, t, p, giorni) {
    const conf = (a, b) => {
      if (p === null) return "<em>&nbsp;</em>";
      if (!b) return a ? '<em class="su">nuovo</em>' : "<em>–</em>";
      const d = Math.round((a - b) / b * 100);
      return d === 0 ? "<em>= prima</em>" : '<em class="' + (d > 0 ? "su" : "giu") + '">' + (d > 0 ? "▲ +" : "▼ ") + d + "%</em>";
    };
    const pc = t.apertura ? Math.round(t.whatsapp / t.apertura * 100) : 0;
    const pp = p && p.apertura ? Math.round(p.whatsapp / p.apertura * 100) : 0;
    const voci = [
      ["ap", "Aperture", t.apertura, p && p.apertura],
      ["", giorni > 1 ? "Telefoni-giorno" : "Telefoni diversi", t.tel, p && p.tel],
      ["wa", "WhatsApp", t.whatsapp, p && p.whatsapp],
      ["", "WhatsApp su aperture", pc + "%", null],
      ["", "Ricerche", t.ricerca, p && p.ricerca],
      ["", "Vocale avviato", t.vocale, p && p.vocale],
      ["", "Vocale fino in fondo", t.vocale_tutto, p && p.vocale_tutto],
      ["", "Chiamate", t.chiama, p && p.chiama],
      ["", "Portale B2B", t.b2b, p && p.b2b],
    ];
    box.innerHTML = voci.map(([cl, nome, v, prima], i) =>
      '<div class="' + cl + '"><small>' + nome + "</small><b>" + v + "</b>" +
      (i === 3 ? (p === null ? "<em>&nbsp;</em>" : "<em>prima " + pp + "%</em>") : conf(v, prima)) + "</div>").join("");
  }

  /* ---------- catalogo ---------- */
  function scheda(c, num) {
    const n = num ? '<div class="mini"><div class="ap"><b>' + (num.apertura || 0) + '</b><small>aperture</small></div><div><b>' + (num.tel || 0) + '</b><small>telefoni</small></div>' +
      '<div class="wa"><b>' + (num.whatsapp || 0) + '</b><small>WhatsApp</small></div><div><b>' + (num.ricerca || 0) + '</b><small>ricerche</small></div><div><b>' + (num.vocale || 0) + '</b><small>vocale</small></div></div>' : "";
    const wa = "https://wa.me/?text=" + encodeURIComponent(FRASE_WA + "\n" + c.url);
    return '<div class="sch" data-c="' + c.c + '"><img src="../' + c.c + '/anteprima.jpg" alt="" loading="lazy" width="1200" height="630">' +
      "<div><b>" + esc(c.titolo) + '</b><div class="dal">online dal ' + ggm(c.dal) + "</div></div>" + n +
      '<div class="bt"><button type="button" class="cp" data-url="' + c.url + '">Copia link</button>' +
      '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' +
      '<a class="ap" href="' + c.url + '" target="_blank" rel="noopener">Apri</a>' +
      (SERIE ? '<button type="button" class="nu" data-c="' + c.c + '">Numeri ›</button>' : "") + "</div></div>";
  }
  function catalogo(per) {
    const ordina = l => l.slice().sort((a, b) => per ? ((per[b.c] || {}).apertura || 0) - ((per[a.c] || {}).apertura || 0) || (b.dal > a.dal ? 1 : -1) : (b.dal > a.dal ? 1 : -1));
    const num = c => per ? (per[c] || {}) : null;
    let h = ARGOMENTI.map(a => {
      const l = ordina(CAMPAGNE.filter(c => c.argomento === a && !c.archiviata));
      return l.length ? "<h2>" + esc(a) + "<small>" + l.length + "</small></h2>" + l.map(c => scheda(c, num(c.c))).join("") : "";
    }).join("");
    const arch = ordina(CAMPAGNE.filter(c => c.archiviata));
    if (arch.length) h += '<details class="arch"><summary>Archiviate (' + arch.length + ")</summary>" + arch.map(c => scheda(c, num(c.c))).join("") + "</details>";
    $("catalogo").innerHTML = h;
  }

  /* bottoni: un solo ascoltatore per tutta la pagina */
  function copia(b) {
    const u = b.dataset.url, fatto = () => { b.textContent = "Copiato ✓"; b.classList.add("ok"); setTimeout(() => { b.textContent = "Copia link"; b.classList.remove("ok"); }, 1800); };
    const vecchio = () => { const t = document.createElement("textarea"); t.value = u; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); fatto(); } catch (e) {} t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(fatto, vecchio); else vecchio();
  }
  document.body.addEventListener("click", e => {
    const b = e.target.closest("button.cp");
    if (b) { e.preventDefault(); copia(b); return; }
    const nu = e.target.closest("button.nu, tr[data-c]");
    if (nu) { apri(nu.dataset.c); return; }
    const th = e.target.closest(".conf th[data-k]");
    if (th) { ordConf = th.dataset.k; mem.set("dash-ord", ordConf); disegna(); return; }
    if (e.target.closest("a, button, summary")) return;
    const s = e.target.closest(".sch");
    if (s) apri(s.dataset.c);
  });

  /* ---------- dettaglio di una locandina ---------- */
  async function apri(c) {
    aperta = c;
    $("vistaElenco").hidden = true; $("vistaDettaglio").hidden = false;
    window.scrollTo(0, 0);
    disegnaDettaglio();
  }
  $("indietro").addEventListener("click", () => {
    const c = aperta; aperta = null;
    $("vistaDettaglio").hidden = true; $("vistaElenco").hidden = false;
    disegna();
    const s = document.querySelector('.sch[data-c="' + c + '"]');
    if (s) s.scrollIntoView({block: "center"});
  });

  let tokenDett = 0;
  async function disegnaDettaglio() {
    const c = PER_C[aperta], [dal, al] = intervallo(), prec = precedente([dal, al]);
    let h = '<div class="det-testa"><img src="../' + c.c + '/anteprima.jpg" alt="" width="1200" height="630"><b>' + esc(c.titolo) + "</b><p>" + esc(c.desc) + "</p><p>" + esc(c.argomento) + " · online dal " + ggm(c.dal) + "</p></div>" +
      scheda(c, null).replace(/^<div class="sch"[^>]*>.*?(<div class="bt">)/s, '<div class="sch" style="cursor:default;grid-template-columns:1fr">$1').replace(/<button type="button" class="nu"[^>]*>[^<]*<\/button>/, "");
    if (!SERIE) { $("dettaglio").innerHTML = h + '<p class="vuoto">Inserisci la chiave per vedere i numeri.</p>'; return; }
    const {t} = somma(dal, al, c.c), p = periodo === "sempre" ? null : somma(prec[0], prec[1], c.c).t;
    h += '<h2>Numeri<small>' + descr(dal, al) + '</small></h2><div class="kpi" id="kpiD"></div><div class="graf" id="grafD"></div>' +
      '<h2>Tutti i tocchi</h2><ul class="elenco">' + TIPI.map(([k, nome]) => "<li><span>" + nome + "</span><b>" + (t[k] || 0) + "</b></li>").join("") + "</ul>" +
      '<h2>Ricerche più fatte</h2><div id="ricD"><p class="vuoto">Carico…</p></div><h2>Righe d\'ordine su WhatsApp</h2><div id="ordD"><p class="vuoto">Carico…</p></div>';
    $("dettaglio").innerHTML = h;
    kpi($("kpiD"), t, p, diff(dal, al) + 1);
    grafico($("grafD"), serieGrafico(dal, al, c.c), c.titolo);
    const mio = ++tokenDett;
    try {
      const r = await leggi("/riepilogo?dal=" + dal + "&al=" + al);
      if (mio !== tokenDett) return;
      const lista = (arr, id) => {
        const l = arr.filter(x => x.campagna === c.c && x.agente === "stefano" && !/^vocale (avviato|ascoltato tutto)$/.test(x.dettaglio)).slice(0, 15);
        $(id).innerHTML = l.length ? '<ul class="elenco">' + l.map(x => "<li><span>" + esc(x.dettaglio) + "</span><b>" + x.n + "</b></li>").join("") + "</ul>" : '<p class="vuoto">Nessuna nel periodo.</p>';
      };
      lista(r.ricerche, "ricD"); lista(r.ordini, "ordD");
    } catch (e) {
      if (mio === tokenDett) { $("ricD").innerHTML = $("ordD").innerHTML = '<p class="vuoto">Non riesco a leggere i dettagli: ' + esc(e.message) + "</p>"; }
    }
  }

  function descr(dal, al) {
    return dal === al ? ggm(dal) : ggm(dal) + " – " + ggm(al);
  }

  /* ---------- tabella locandina per locandina ---------- */
  function confronto(per) {
    const col = [["apertura", "Apert."], ["tel", "Tel."], ["whatsapp", "WA"], ["ricerca", "Ric."], ["vocale", "Voc."]];
    const v = (c, k) => (per[c] || {})[k] || 0;
    const l = CAMPAGNE.slice().sort((a, b) => v(b.c, ordConf) - v(a.c, ordConf) || v(b.c, "apertura") - v(a.c, "apertura") || (a.titolo > b.titolo ? 1 : -1));
    $("conf").innerHTML = "<h3>Locandina per locandina</h3><table><tr><th>Locandina</th>" +
      col.map(([k, t]) => '<th data-k="' + k + '"' + (k === ordConf ? ' class="on"' : "") + ">" + t + (k === ordConf ? " ▼" : "") + "</th>").join("") + "</tr>" +
      l.map(c => '<tr data-c="' + c.c + '"' + (v(c.c, "apertura") ? "" : ' class="zero"') + "><td>" + esc(c.titolo.split(" · ")[0]) + "</td>" + col.map(([k]) => "<td>" + v(c.c, k) + "</td>").join("") + "</tr>").join("") +
      '</table><p class="nota">WA = WhatsApp, Ric. = ricerche, Voc. = vocale avviato. Tocca una colonna per ordinare, una riga per aprire la locandina.</p>';
  }

  /* ---------- disegno della vista elenco ---------- */
  function disegna() {
    if (aperta) { disegnaDettaglio(); return; }
    if (!SERIE) { $("statistiche").hidden = true; catalogo(null); return; }
    const [dal, al] = intervallo(), prec = precedente([dal, al]);
    const cur = somma(dal, al), p = periodo === "sempre" ? null : somma(prec[0], prec[1]).t;
    $("statistiche").hidden = false;
    kpi($("kpi"), cur.t, p, diff(dal, al) + 1);
    grafico($("graf"), serieGrafico(dal, al), "il periodo");
    confronto(cur.per);
    $("notaTel").textContent = descr(dal, al) + (p ? " · confronto con " + descr(prec[0], prec[1]) : "") +
      ". «WhatsApp» = il cliente ha aperto WhatsApp col messaggio pronto, non vuol dire che l'ha inviato." +
      (diff(dal, al) > 0 ? " I telefoni si riconoscono solo nello stesso giorno: «telefoni-giorno» è la somma dei giorni." : "");
    catalogo(cur.per);
  }

  /* ---------- lettura dal contatore ---------- */
  async function leggi(perc) {
    const r = await fetch(ENDPOINT + perc, {headers: {"X-Chiave": chiave}, cache: "no-store"});
    if (r.status === 401) { const e = new Error("chiave non valida"); e.chiave = true; throw e; }
    if (!r.ok) throw new Error("errore " + r.status);
    return r.json();
  }
  async function carica() {
    if (!chiave) { mostraChiave(""); disegna(); return; }
    $("stato").textContent = "Carico i numeri…";
    try {
      SERIE = await leggi("/serie");
      oraAgg = new Date();
      $("boxChiave").hidden = true; $("aggiorna").hidden = false; $("dimentica").hidden = false;
      $("stato").textContent = "Numeri aggiornati alle " + oraAgg.toLocaleTimeString("it-IT", {hour: "2-digit", minute: "2-digit"}) + " · dati dal " + ggm(SERIE.partenza || oggi());
    } catch (e) {
      SERIE = null;
      if (e.chiave) { chiave = ""; mem.del("dash-chiave"); mostraChiave("La chiave non è valida: incollala di nuovo."); }
      else { $("stato").textContent = "Non riesco a leggere i numeri (" + e.message + "). Riprova con «Aggiorna»."; $("aggiorna").hidden = false; }
    }
    disegna();
  }
  function mostraChiave(msg) {
    $("boxChiave").hidden = false; $("aggiorna").hidden = true; $("dimentica").hidden = true;
    $("chiaveTesto").innerHTML = msg ? '<span class="errore">' + esc(msg) + "</span>" : "Per vedere i numeri incolla la chiave del contatore. Resta salvata solo su questo telefono.";
    $("stato").textContent = "Elenco aggiornato al " + ggm(GENERATO) + " " + GENERATO.slice(0, 4);
  }
  $("salva").addEventListener("click", () => {
    const v = $("chiave").value.trim();
    if (!v) return;
    chiave = v; mem.set("dash-chiave", v); $("chiave").value = "";
    carica();
  });
  $("chiave").addEventListener("keydown", e => { if (e.key === "Enter") $("salva").click(); });
  $("aggiorna").addEventListener("click", carica);
  $("dimentica").addEventListener("click", () => { chiave = ""; SERIE = null; mem.del("dash-chiave"); mostraChiave(""); disegna(); });

  carica();
});
</script>
</body>
</html>
